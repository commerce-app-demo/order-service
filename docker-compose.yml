version: '3.12'
services:
  order_db:
    image: docker.io/mysql:lts
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:z
      - order_db_vol:/var/lib/mysql
    ports:
      - 3308:3306
    networks:
      - order_db
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: order_db 
      MYSQL_USER: order_user
      MYSQL_PASSWORD: order_pass

  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    ports:
      - "29092:29092"  # for host access
      - "9092:9092"    # for docker network access
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes  

  kafbat-ui:
    container_name: kafbat-ui
    image: ghcr.io/kafbat/kafka-ui
    ports:
      - 8080:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: true
    volumes:
      - ~/kafbat-ui/config.yml:/etc/kafkaui/dynamic_config.yaml
    depends_on:
      - kafka

volumes:
  order_db_vol:

networks:
  order_db:
    driver: bridge